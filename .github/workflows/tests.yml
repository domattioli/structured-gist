name: Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  tests:
    runs-on: ubuntu-latest
    name: pytest and smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run pytest
        run: python -m pytest skills/structured-gist/tests/ -q

      - name: Run smoke tests
        run: bash skills/structured-gist/tests/smoke.sh
